# Rolling "nightly" pre-release (Linux/Windows/web zips) and GitHub Pages for the web build.
# Triggered only after a successful CI run on main (a push, not a pull request or a dispatch).
#
# DO NOT MERGE until Karyu approves publishing. This workflow would publish a pre-release
# and a public Pages site the first time it runs on main.
#
# Repo settings required (not changed by this PR):
#   * Actions → General → Workflow permissions: allow the GITHUB_TOKEN to have contents: write
#     (the workflow requests it below; some orgs also need "Read and write" as the default).
#   * Settings → Pages → Source: GitHub Actions.
#   * Do not add environment protection rules on "github-pages" unless Karyu wants an
#     extra approval each night.
name: Nightly + Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Never grant these on the main CI workflow. This file is the only publisher.
permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: nightly-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Nightly pre-release + Pages
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Artifact identity
        id: ids
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "sha7=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scriptshot-linux-*
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scriptshot-windows-*
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scriptshot-web-*
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Pack zips
        id: pack
        env:
          SHA7: ${{ steps.ids.outputs.sha7 }}
        run: |
          set -euo pipefail
          # download-artifact writes each artifact to dist/<artifact-name>/.
          linux="$(find dist -maxdepth 1 -type d -name 'scriptshot-linux-*' | head -1)"
          windows="$(find dist -maxdepth 1 -type d -name 'scriptshot-windows-*' | head -1)"
          web="$(find dist -maxdepth 1 -type d -name 'scriptshot-web-*' | head -1)"
          test -n "$linux" && test -s "$linux/Scriptshot.x86_64" \
            || { echo "::error::Linux artifact missing Scriptshot.x86_64"; ls -laR dist; exit 1; }
          test -s "$linux/libscriptshot_native.linux.template_release.x86_64.so" \
            || { echo "::error::Linux artifact missing the native bullet .so"; exit 1; }
          test -s "$linux/libluagdextension.linux.template_release.x86_64.so" \
            || { echo "::error::Linux artifact missing the Lua .so"; exit 1; }
          test -s "$windows/Scriptshot.exe" \
            || { echo "::error::Windows artifact missing Scriptshot.exe"; exit 1; }
          test -s "$windows/libscriptshot_native.windows.template_release.x86_64.dll" \
            || { echo "::error::Windows artifact missing the native bullet DLL"; exit 1; }
          test -s "$windows/libluagdextension.windows.template_release.x86_64.dll" \
            || { echo "::error::Windows artifact missing the Lua DLL"; exit 1; }
          test -s "$web/index.html" && test -s "$web/index.pck" \
            || { echo "::error::Web artifact missing index.html or index.pck"; exit 1; }
          test -s "$web/libluagdextension.web.template_release.wasm32.nothreads.wasm" \
            || { echo "::error::Web artifact missing the Lua side module"; exit 1; }
          test ! -e "$web/libscriptshot_native.web.template_release.wasm32.nothreads.wasm" \
            || { echo "::error::Web artifact must not contain the native bullet wasm"; exit 1; }
          mkdir -p zips web-pages
          # Flatten to a stable folder name inside each zip.
          mkdir -p pack/linux pack/windows
          cp -a "$linux"/. pack/linux/
          cp -a "$windows"/. pack/windows/
          chmod +x pack/linux/Scriptshot.x86_64
          (cd pack && zip -r -q "../zips/scriptshot-linux-${SHA7}.zip" linux)
          (cd pack && zip -r -q "../zips/scriptshot-windows-${SHA7}.zip" windows)
          (cd "$web" && zip -r -q "$PWD/../../zips/scriptshot-web-${SHA7}.zip" .)
          # Pages wants the site at the artifact root.
          cp -a "$web"/. web-pages/
          ls -lh zips web-pages
      - name: Rolling nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ids.outputs.sha }}
          SHA7: ${{ steps.ids.outputs.sha7 }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          # Replace the previous nightly tag in place. This is a pre-release, not "latest".
          gh release delete nightly --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly \
            --repo "${GITHUB_REPOSITORY}" \
            --prerelease \
            --target "$SHA" \
            --title "Scriptshot nightly ${SHA7}" \
            --notes "$(printf '%s\n' \
              "Unsigned playable builds from \`${SHA}\`." \
              "" \
              "Source CI run: ${RUN_URL}" \
              "" \
              "Windows: SmartScreen will warn on first launch (More info > Run anyway)." \
              "Linux: \`chmod +x Scriptshot.x86_64\` after unzip, then run it." \
              "macOS is not included. There is no GitHub Pages link until Pages is enabled in repo settings." \
            )" \
            "zips/scriptshot-linux-${SHA7}.zip" \
            "zips/scriptshot-windows-${SHA7}.zip" \
            "zips/scriptshot-web-${SHA7}.zip"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web-pages
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
