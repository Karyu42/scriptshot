# Scriptshot CI.
#   test   : headless import + GUT suite (./tools/run_tests.sh) on every PR and push to main.
#   perf   : headless bullet benchmark (./tools/run_benchmark.sh) on every PR. p95 <= 16.6 ms is a HARD gate at
#            5,000 bullets (floor) and a warning-only target at 10,000 (tools/ci/check_perf.py).
#   export : manual (workflow_dispatch) Windows/macOS/Linux/Web/Android export (unsigned/debug). docs/qa/release-builds.md.
#   native-libs : DISABLED stub for per-platform native Lua libraries (bin/<platform>/); enable only if the binding is a GDExtension.
# Headless numbers use the dummy renderer: they measure CPU simulation cost, not GPU/rendering.
# See docs/qa/stress-test-plan.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_export:
        description: "Run the export matrix (needs a committed export_presets.cfg)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Single source of truth for the engine version. Keep in sync with
  # config/features in project.godot ("4.7") and the vendored GUT (addons/gut, 9.7.x = Godot 4.7.x).
  GODOT_VERSION: "4.7.2"
  GODOT_CHANNEL: stable
  GODOT_DIR: ${{ github.workspace }}/.godot-bin
  # tools/run_tests.sh and tools/run_benchmark.sh honour $GODOT.
  GODOT: ${{ github.workspace }}/.godot-bin/godot
  PYTHONDONTWRITEBYTECODE: "1"
  # Toolchain pins, taken from the Godot 4.7.2-stable tag (godotengine/godot): Android from
  # platform/android/java/app/config.gradle (compileSdk 36, buildTools 36.1.0, ndkVersion 29.0.14206865,
  # Java 17), Python/SCons from .github/actions/godot-deps (SCons 4.10.1), Emscripten from
  # .github/workflows/web_builds.yml (EM_VERSION 4.0.11). Update them together with GODOT_VERSION.
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.1.0"
  ANDROID_NDK_VERSION: "29.0.14206865"
  SCONS_VERSION: "4.10.1"
  EMSCRIPTEN_VERSION: "4.0.11"

jobs:
  test:
    name: Import + GUT tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-bin-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}

      - name: Download Godot (pinned, checksum-verified)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          zip="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          mkdir -p "$GODOT_DIR" && cd "$GODOT_DIR"
          curl -fsSL --retry 3 -O "$base/$zip" -O "$base/SHA512-SUMS.txt"
          grep -F " $zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" && rm "$zip"
          mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" godot
          chmod +x godot

      - name: Godot version
        run: |
          "$GODOT" --headless --version
          # Fail early if the engine and the project's declared version drift apart.
          want="${GODOT_VERSION%.*}"
          grep -q "config/features=.*\"$want\"" project.godot \
            || { echo "::error::project.godot config/features does not list \"$want\" (GODOT_VERSION=$GODOT_VERSION)"; exit 1; }

      # PLACEHOLDER: the Lua binding is undecided. If it ships as a GDExtension, its native
      # libraries (linux.x86_64 here; windows/macos/web in the export job) must be present
      # before import, or Godot reports "Verifying GDExtensions" failures. Add
      # tools/ci/fetch_native_libs.sh (download pinned release assets + verify checksums, or
      # `git lfs pull`) and this step starts running automatically.
      - name: Fetch native Lua libraries (linux.x86_64)
        if: ${{ hashFiles('tools/ci/fetch_native_libs.sh') != '' }}
        run: bash tools/ci/fetch_native_libs.sh linux.x86_64

      - name: Run GUT tests (headless)
        run: |
          mkdir -p reports
          # run_tests.sh = `godot --headless --import` + `-s res://addons/gut/gut_cmdln.gd -gexit`.
          # It exits non-zero on a test failure, a non-zero import exit, or any line matching its
          # ERROR_PATTERN (SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|
          # Failed to instantiate) in the import or test output. Config: .gutconfig.json (tests/unit).
          # Extra args pass straight to GUT. When the Lua GDExtension lands, add
          # "Failed to load GDExtension" to ERROR_PATTERN in tools/run_tests.sh.
          ./tools/run_tests.sh -gjunit_xml_file="res://reports/gut-junit.xml" 2>&1 | tee reports/gut.log
          exit "${PIPESTATUS[0]}"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### GUT"
            sed 's/\x1b\[[0-9;]*m//g' reports/gut.log \
              | grep -E "^(Scripts|Tests|Passing Tests|Failing Tests|Risky/Pending|Asserts|Time) |All tests passed|tests? failed" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
          if-no-files-found: ignore

  perf:
    name: Bullet benchmark (headless, p95 gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - uses: actions/cache@v4
        id: cache-godot
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-bin-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}
      - name: Download Godot (pinned, checksum-verified)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          zip="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          mkdir -p "$GODOT_DIR" && cd "$GODOT_DIR"
          curl -fsSL --retry 3 -O "$base/$zip" -O "$base/SHA512-SUMS.txt"
          grep -F " $zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" && rm "$zip"
          mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" godot
          chmod +x godot
      # PLACEHOLDER: fetch per-platform native Lua libs here once the binding is chosen (see test job).
      - name: Fetch native Lua libraries (linux.x86_64)
        if: ${{ hashFiles('tools/ci/fetch_native_libs.sh') != '' }}
        run: bash tools/ci/fetch_native_libs.sh linux.x86_64
      - name: Unit-test the perf gate (tools/ci/check_perf.py)
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Run benchmark (5k floor + 10k target)
        run: |
          mkdir -p reports
          # run_benchmark.sh imports (and fails on script/resource errors), then runs the scene, which
          # exits 1 when the --target-bullets count is not benchmarked, was not actually reached
          # (fewer alive than requested), or misses --target-ms at p95.
          # Its own default target is 10,000, but our policy is 5k = hard floor and 10k = warn-only,
          # so the benchmark's verdict is pinned to the 5k floor here and check_perf.py judges 10k.
          # The JSON is written either way; a benchmark failure is tolerated only if it left JSON
          # behind and was not caused by an import/script error (those print "run_benchmark.sh: ...").
          set +e
          ./tools/run_benchmark.sh --bullets=2000,5000,10000 --target-bullets=5000 --target-ms=16.6 \
            --json="$PWD/reports/bench.json" 2>&1 | tee reports/bench.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^run_benchmark.sh:' reports/bench.log; then
            echo "::error::benchmark run failed on import/script errors"; exit 1
          fi
          [ -s reports/bench.json ] || { echo "::error::benchmark produced no JSON (exit $rc)"; exit 1; }
      - name: Enforce budget (5k hard fail, 10k warn-only)
        run: |
          # Annotations (::error::/::warning::) go to the log; the full table and verdict lines are
          # appended to the job's step summary. PERF_BASELINE (repo variable) = path to a committed
          # bench.json from main (5k regression fails, 10k regression warns); unset = budget only.
          python3 tools/ci/check_perf.py reports/bench.json \
            --p95-ms 16.6 --floor-bullets 5000 --target-bullets 10000 --regression-pct 25 \
            --summary "$GITHUB_STEP_SUMMARY" \
            ${{ vars.PERF_BASELINE && format('--baseline {0}', vars.PERF_BASELINE) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-reports
          path: reports/
          if-no-files-found: ignore

  export:
    name: Export (${{ matrix.preset }})
    # Manual only. Preset names must match export_presets.cfg exactly (commit it; PR #2 un-ignored it,
    # export_credentials.cfg stays ignored). Everything is exported from Linux with the headless editor:
    # Windows/macOS/Linux/Web are release builds, unsigned (macOS is ad-hoc signed only), Android is a
    # DEBUG apk signed with a throwaway debug keystore generated below. Release signing for Android needs a
    # keystore secret (GODOT_ANDROID_KEYSTORE_RELEASE_*), which is Karyu's call and is not wired up.
    if: github.event_name == 'workflow_dispatch' && inputs.run_export
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: "Windows Desktop", platform: "windows.x86_64", mode: release, out: "build/windows/scriptshot.exe" }
          - { preset: "macOS",           platform: "macos.universal", mode: release, out: "build/macos/scriptshot.zip" }
          - { preset: "Linux",           platform: "linux.x86_64",   mode: release, out: "build/linux/scriptshot.x86_64" }
          - { preset: "Web",             platform: "web.wasm32",     mode: release, out: "build/web/index.html" }
          - { preset: "Android",         platform: "android.arm64",  mode: debug,   out: "build/android/scriptshot-debug.apk" }
          # iOS is NOT a release target. If an iOS compile check is ever wanted it must run on a macOS
          # runner and is low priority; leave this commented out:
          # - { preset: "iOS", platform: "ios.universal", mode: debug, out: "build/ios/scriptshot.xcodeproj" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - uses: actions/cache@v4
        id: cache-godot
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-bin-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}
      - name: Download Godot (pinned, checksum-verified)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          zip="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          mkdir -p "$GODOT_DIR" && cd "$GODOT_DIR"
          curl -fsSL --retry 3 -O "$base/$zip" -O "$base/SHA512-SUMS.txt"
          grep -F " $zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" && rm "$zip"
          mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" godot
          chmod +x godot
      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_CHANNEL }}
          key: godot-templates-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}
      - name: Download export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          tpz="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz"
          curl -fsSL --retry 3 -O "$base/$tpz" -O "$base/SHA512-SUMS.txt"
          grep -F " $tpz" SHA512-SUMS.txt | sha512sum -c -
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          mkdir -p "$dest" && unzip -q "$tpz" -d tpl && mv tpl/templates/* "$dest/"

      # ---- Android only: JDK, SDK packages, throwaway debug keystore, editor settings ----
      - name: Set up JDK ${{ env.JAVA_VERSION }} (Android)
        if: matrix.preset == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Android SDK packages (Android)
        if: matrix.preset == 'Android'
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || { echo "::error::sdkmanager not found under $sdk (runner image changed?)"; exit 1; }
          "$sdkmanager" --licenses >/dev/null < <(yes)
          "$sdkmanager" "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;android-${ANDROID_COMPILE_SDK}"
          echo "ANDROID_SDK_DIR=$sdk" >> "$GITHUB_ENV"
      - name: Generate debug keystore and editor settings (Android)
        if: matrix.preset == 'Android'
        run: |
          set -euo pipefail
          # Throwaway key, regenerated every run. The well-known debug credentials are not secrets.
          # APKs from different runs therefore cannot be installed over each other (uninstall first).
          ks="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -keystore "$ks" -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Scriptshot CI Debug,O=Scriptshot,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$ks"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          # The headless editor reads the SDK/JDK locations from its editor settings file.
          major_minor="${GODOT_VERSION%.*}"
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_DIR\""
          } > "$HOME/.config/godot/editor_settings-${major_minor}.tres"

      - name: Check export preset policy
        run: |
          set -euo pipefail
          test -f export_presets.cfg || { echo "::error::export_presets.cfg missing (commit it; see PR #2 .gitignore note)"; exit 1; }
          python3 tools/ci/check_export_preset.py export_presets.cfg "${{ matrix.preset }}"
      # PLACEHOLDER: per-platform native Lua libraries. If the binding is a GDExtension, each
      # export needs that platform's library under bin/<platform>/ (see docs/qa/release-builds.md);
      # Web needs the wasm32 build matching the Web preset's thread_support, Android needs arm64.
      - name: Fetch native Lua libraries (${{ matrix.platform }})
        if: ${{ hashFiles('tools/ci/fetch_native_libs.sh') != '' }}
        run: bash tools/ci/fetch_native_libs.sh "${{ matrix.platform }}"
      - name: Export
        run: |
          set -euo pipefail
          mkdir -p "$(dirname '${{ matrix.out }}')"
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . --export-${{ matrix.mode }} "${{ matrix.preset }}" "${{ matrix.out }}"
          ls -la "$(dirname '${{ matrix.out }}')"
      - uses: actions/upload-artifact@v4
        with:
          name: scriptshot-${{ matrix.preset }}
          path: build/

  # DISABLED stub (runs only when vars.ENABLE_NATIVE_LIBS == 'true'). Native builds of GDExtension libraries on GitHub-hosted runners, one per
  # platform, each uploading bin/<platform>/. Enable (set the variable) only when the binding decision
  # needs it and tools/ci/build_native_libs.sh exists. Toolchain pins come from the Godot 4.7.2 tag (see env).
  # Note: upstream Godot 4.7.2 builds macOS on macos-26; this project decided macos-14 (Apple Silicon).
  native-libs:
    name: Native libs (${{ matrix.platform }})
    # Off until the repository variable ENABLE_NATIVE_LIBS is set to 'true'.
    if: ${{ vars.ENABLE_NATIVE_LIBS == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: "linux.x86_64",    runner: ubuntu-24.04,    target: linux }
          - { platform: "windows.x86_64",  runner: windows-latest,  target: windows }  # MSVC (preinstalled VS Build Tools)
          - { platform: "macos.universal", runner: macos-14,        target: macos }
          - { platform: "web.wasm32",      runner: ubuntu-24.04,    target: web }       # threads and nothreads variants
          - { platform: "android.arm64",   runner: ubuntu-24.04,    target: android }
          # - { platform: "ios.universal", runner: macos-14, target: ios }  # not a release target; optional compile check only
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install SCons ${{ env.SCONS_VERSION }}
        shell: bash
        run: python -m pip install "scons==${SCONS_VERSION}"
      - name: Set up Emscripten ${{ env.EMSCRIPTEN_VERSION }}
        if: matrix.target == 'web'
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          no-cache: true
      - name: Set up JDK ${{ env.JAVA_VERSION }} and NDK ${{ env.ANDROID_NDK_VERSION }}
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Android NDK
        if: matrix.target == 'android'
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=$sdk/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: bash tools/ci/build_native_libs.sh "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-libs-${{ matrix.platform }}
          path: bin/${{ matrix.platform }}/
          if-no-files-found: error
