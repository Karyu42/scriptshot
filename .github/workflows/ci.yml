# Scriptshot CI.
#   test   : headless import + GUT suite (./tools/run_tests.sh) and the export-preset policy check
#            (tools/ci/check_export_preset.py, all five presets) on every PR and push to main.
#   perf   : headless bullet benchmark (tools/ci/perf_ab.sh -> ./tools/run_benchmark.sh, plain + hooked) on every PR
#            and push to main, gated by tools/ci/check_perf.py. On a PR, main is benchmarked in the same job on the
#            same runner (ABBA rounds): head 5k p95 may not exceed base x 1.10, and head raw p95 must meet the bar
#            (plain 16.6 ms, hooked 22.0 ms at 5,000 bullets; HARD). Only if main's own p95 on this runner also misses
#            a bar (slow runner) does that bar become bar x min(F, 1.5), F = base plain 5k p95 / 7.5 ms (>= 1.0).
#            10,000 bullets is warning-only. Push to main: the same rules, with the parent commit (the previous main
#            tip) benchmarked in the same job as the base (CoS ruling 2026-11-10); if the parent cannot be checked out
#            or benchmarked, the raw bars only (logged as FALLBACK). Dispatch: the raw bars only, unless the
#            perf_parent_base input runs the push code path against HEAD^1.
#   perf-native : "Bullet benchmark (native on_batch, p95 gate)", on every PR and push to main after Native libs (linux):
#            the native on_batch tier (--backend=native --batch=1) gated by check_perf.py on its own bars (6.0 ms 5k
#            hard, 10.0 ms 10k warn) with the same #42 rules, plus an informational --backend=auto row. See the job.
#   web-smoke : on every PR and push to main, tools/ci/web_smoke.sh: exports the shipping "Web" preset and the
#            "Web (smoke)" preset (release and debug, web_dlink_nothreads templates), checks the files (Lua side
#            module in, native bullet wasm and src/qa/ out of the shipping export) and loads them in headless
#            Chromium (boot; a Lua shot through ScriptHost; one fallback warning when native is requested).
#            docs/qa/release-builds.md section 4.1.
#   export : on push to main (after Import + GUT passes), unsigned Linux/Windows/Web releases, uploaded as
#            scriptshot-{linux,windows,web}-<sha7> and kept for 90 days. workflow_dispatch with run_export runs the
#            full matrix, including macOS (ad-hoc) and Android (debug). Not run on pull requests. docs/qa/release-builds.md.
#   native-linux / native-web / gut-windows / gut-macos ("Native libs (linux)", "Native libs (web)",
#            "GUT (windows, native)", "GUT (macos, native)"): on every PR and push to main, build the native bullet core
#            (tools/build_native.sh, native/godot-cpp submodule) and, except web, run the full GUT suite with it loaded
#            and 0 pending (tools/ci/gut_counts.py --expect-native). Issue #38; see the comment above those jobs.
# Checkout does not enable Git LFS. Submodules (native/godot-cpp) are checked out only by the native jobs.
# Headless numbers use the dummy renderer: they measure CPU simulation cost, not GPU/rendering.
# See docs/qa/stress-test-plan.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_export:
        description: "Run the full export matrix (Linux/Windows/Web plus macOS and Android; needs a committed export_presets.cfg)"
        type: boolean
        default: false
      perf_parent_base:
        description: "Perf gate: benchmark HEAD^1 as the same-run base, exactly like a push to main (push-mode dry run)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Single source of truth for the engine version. Keep in sync with
  # config/features in project.godot ("4.7") and the vendored GUT (addons/gut, 9.7.x = Godot 4.7.x).
  GODOT_VERSION: "4.7.2"
  GODOT_CHANNEL: stable
  GODOT_DIR: ${{ github.workspace }}/.godot-bin
  # tools/run_tests.sh and tools/run_benchmark.sh honour $GODOT.
  GODOT: ${{ github.workspace }}/.godot-bin/godot
  PYTHONDONTWRITEBYTECODE: "1"
  # Toolchain pins, taken from the Godot 4.7.2-stable tag (godotengine/godot): Android from
  # platform/android/java/app/config.gradle (compileSdk 36, buildTools 36.1.0, ndkVersion 29.0.14206865,
  # Java 17), Python/SCons from .github/actions/godot-deps (SCons 4.10.1), Emscripten from
  # .github/workflows/web_builds.yml (EM_VERSION 4.0.11). Update them together with GODOT_VERSION.
  # NDK stays 29.0.14206865. r28b (28.1.13356709) is not the pin: docs/scripting/spike-results.md
  # section 12 and docs/qa/release-builds.md chose Godot's own NDK for the shared pipeline.
  # EMSCRIPTEN_VERSION is NOT the engine workflow's EM_VERSION (4.0.11, CI file only): it is 4.0.20, the
  # build-container pin of the official 4.7.2 web export templates, which a side module must match
  # (docs/native.md "Build pins", docs/scripting/testing.md). Used by the Native libs (web) job.
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.1.0"
  ANDROID_NDK_VERSION: "29.0.14206865"
  # godot-cpp 10.0.0-stable (2026-09-15), api_version 4.7. The native jobs check that the
  # native/godot-cpp submodule is this commit. Not lua-gdextension 0.8.2's 58d1de7 (10.0.0-rc1, 4.6 API).
  GODOT_CPP_COMMIT: "507ed9d840c01a3c5b2a39af8bb4000bfac30bf5"
  SCONS_VERSION: "4.10.1"
  EMSCRIPTEN_VERSION: "4.0.20"

jobs:
  test:
    name: Import + GUT tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check export preset policy
        run: |
          set -euo pipefail
          test -f export_presets.cfg || { echo "::error::export_presets.cfg is not committed"; exit 1; }
          # Same checker the manual export job runs. Pure Python, so a bad codesign / ABI /
          # keystore flag fails the PR instead of waiting for a workflow_dispatch export.
          for preset in "Windows Desktop" "macOS" "Linux" "Web" "Android" "Web (smoke)"; do
            python3 tools/ci/check_export_preset.py export_presets.cfg "$preset"
          done

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-bin-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}

      - name: Download Godot (pinned, checksum-verified)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          zip="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          mkdir -p "$GODOT_DIR" && cd "$GODOT_DIR"
          curl -fsSL --retry 3 -O "$base/$zip" -O "$base/SHA512-SUMS.txt"
          grep -F " $zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" && rm "$zip"
          mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" godot
          chmod +x godot

      - name: Godot version
        run: |
          "$GODOT" --headless --version
          # Fail early if the engine and the project's declared version drift apart.
          want="${GODOT_VERSION%.*}"
          grep -q "config/features=.*\"$want\"" project.godot \
            || { echo "::error::project.godot config/features does not list \"$want\" (GODOT_VERSION=$GODOT_VERSION)"; exit 1; }

      # Stock lua-gdextension 0.8.2 (Lua 5.4). The script checks the zip SHA256 and
      # pre-seeds .godot/extension_list.cfg (issue #7). run_tests.sh fetches again;
      # that second call is a no-op when the pin file is already present.
      - name: Fetch native Lua libraries (linux.x86_64)
        if: ${{ hashFiles('tools/ci/fetch_native_libs.sh') != '' }}
        run: bash tools/ci/fetch_native_libs.sh linux.x86_64

      # Mid-suite GUT stalls (#67) are not covered by the #41 exit-after-results
      # guard in tools/run_tests.sh. A step timeout fails the step with
      # "The action has timed out" instead of sitting until the job timeout.
      # 6 minutes is just over 4x the slowest successful Linux GUT step in
      # recent CI (77s).
      - name: Run GUT tests (headless)
        timeout-minutes: 6
        run: |
          mkdir -p reports
          # run_tests.sh = `godot --headless --import` + `-s res://addons/gut/gut_cmdln.gd -gexit`.
          # It exits non-zero on a test failure, a non-zero import exit, or any line matching its
          # ERROR_PATTERN (SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|
          # Failed to instantiate) in the import or test output. Config: .gutconfig.json (tests/unit).
          # Extra args pass straight to GUT. ERROR_PATTERN includes
          # "Failed to load GDExtension" so a missing or broken addon fails the job.
          ./tools/run_tests.sh -gjunit_xml_file="res://reports/gut-junit.xml" 2>&1 | tee reports/gut.log
          exit "${PIPESTATUS[0]}"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### GUT"
            sed 's/\x1b\[[0-9;]*m//g' reports/gut.log \
              | grep -E "^(Scripts|Tests|Passing Tests|Failing Tests|Risky/Pending|Asserts|Time) |All tests passed|pending/risky tests|tests? failed" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            reports/
          if-no-files-found: ignore

  perf:
    name: Bullet benchmark (headless, p95 gate)
    runs-on: ubuntu-24.04
    # 2 rounds x (base + head) x (plain + hooked) on PRs: about 4x the old benchmark time.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 2 so the PR test-merge commit's first parent (the base main) is available for the baseline.
          fetch-depth: 2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-godot
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-bin-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}
      - name: Download Godot (pinned, checksum-verified)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          zip="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          mkdir -p "$GODOT_DIR" && cd "$GODOT_DIR"
          curl -fsSL --retry 3 -O "$base/$zip" -O "$base/SHA512-SUMS.txt"
          grep -F " $zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" && rm "$zip"
          mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" godot
          chmod +x godot
      - name: Fetch native Lua libraries (linux.x86_64)
        if: ${{ hashFiles('tools/ci/fetch_native_libs.sh') != '' }}
        run: bash tools/ci/fetch_native_libs.sh linux.x86_64
      - name: Unit-test the perf gate (tools/ci/check_perf.py)
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Check out the PR base for a same-runner baseline (pull_request only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The PR checkout is the test-merge commit (PR merged into main), so its first parent is the main
          # it was merged onto: exactly "main without this PR". If HEAD is not a merge (unexpected), fall back
          # to the event's pull_request.base.sha.
          if git rev-parse --verify -q HEAD^2 >/dev/null; then
            base="$(git rev-parse HEAD^1)"
            echo "baseline = first parent of the test-merge commit: $base"
          else
            base="$BASE_SHA"
            git fetch --no-tags --depth=1 origin "$base"
            echo "baseline = pull_request.base.sha: $base"
          fi
          git worktree add --detach "$RUNNER_TEMP/perf-base" "$base"
          echo "PERF_BASE_DIR=$RUNNER_TEMP/perf-base" >> "$GITHUB_ENV"
      - name: Check out the parent commit for a same-runner baseline (push to main; dispatch with perf_parent_base)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.perf_parent_base)
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          # CoS ruling 2026-11-10: a push to main is gated like a PR, against its parent commit (the previous main
          # tip) benchmarked in this job on this runner. Base = github.event.before (the main tip before the push)
          # if it is a real commit, else HEAD^1 (first parent; for a PR merge commit that is the same commit).
          # No parent (first commit, zero/absent before with no HEAD^1) or a failed checkout = FALLBACK: no
          # PERF_BASE_DIR, so check_perf.py applies the raw bars only and logs why. Never looser than the raw bars.
          # A parent that checks out but cannot be benchmarked (e.g. predates tools/run_benchmark.sh or --hooked)
          # is handled by perf_ab.sh / check_perf.py the same way as a failing PR base: raw bars, logged.
          echo "PERF_BASE_KIND=push-parent" >> "$GITHUB_ENV"
          fallback() {
            echo "::warning::perf base: none ($1); FALLBACK to the raw bars only (plain 16.6 / hooked 22.0 ms at 5k)"
            echo "PERF_NO_BASE_REASON=$1" >> "$GITHUB_ENV"
            exit 0
          }
          parent="$(git rev-parse --verify -q 'HEAD^1^{commit}' || true)"
          echo "HEAD = $(git rev-parse HEAD), HEAD^1 = ${parent:-none}, github.event.before = ${BEFORE_SHA:-none}"
          base=""
          if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null \
              || git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; then
              base="$BEFORE_SHA"
              echo "baseline = github.event.before (main tip before this push): $base"
              if [ -n "$parent" ] && [ "$parent" != "$base" ]; then
                echo "::notice::github.event.before ($base) is not HEAD^1 ($parent): multi-commit push or force-push; the base is the previous branch tip"
              fi
            else
              echo "::warning::github.event.before $BEFORE_SHA could not be fetched; trying HEAD^1"
            fi
          fi
          if [ -z "$base" ]; then
            [ -n "$parent" ] || fallback "HEAD has no parent commit (first commit or no history)"
            base="$parent"
            echo "baseline = HEAD^1 (first parent): $base"
          fi
          git worktree add --detach "$RUNNER_TEMP/perf-base" "$base" \
            || fallback "git worktree add of the parent $base failed"
          echo "PERF_BASE_DIR=$RUNNER_TEMP/perf-base" >> "$GITHUB_ENV"
          echo "PERF_BASE_SHA=$base" >> "$GITHUB_ENV"
      - name: Run benchmarks (plain + hooked; on PRs alternating base and head on this runner)
        run: |
          mkdir -p reports
          # tools/ci/perf_ab.sh runs the plain tier (--bullets=2000,5000,10000) and the hooked tier (--hooked=1.0,
          # every bullet carries a no-op on_update hook; --bullets=5000,10000) through ./tools/run_benchmark.sh.
          # pull_request: base (main) and head run in this job on the same runner, 2 rounds in ABBA order
          # (base, head, head, base) so drift during the job cancels out; rounds are merged per count with
          # tools/ci/merge_bench.py (median of the p95s = the mean for 2 rounds). Output: reports/bench.json,
          # reports/bench-hooked.json (head), reports/base-bench.json, reports/base-bench-hooked.json (base),
          # plus reports/raw/ and reports/logs/ per run. A head import/script error or a missing JSON fails
          # here; a failing base run only warns and check_perf.py falls back to the absolute budgets.
          # push to main: the parent commit is the base (previous step), same ABBA rounds as a PR. If it could not
          # be checked out, or on a plain workflow_dispatch: no base, the head runs once.
          # The benchmark's own exit code (its built-in 16.6 ms floor check) is ignored: check_perf.py is the gate.
          set -o pipefail
          args=(--out=reports --rounds=1)
          if [ -n "${PERF_BASE_DIR:-}" ]; then
            args=(--out=reports --rounds=2 --base="$PERF_BASE_DIR")
          fi
          ./tools/ci/perf_ab.sh "${args[@]}" 2>&1 | tee reports/bench.log
      - name: Enforce budget (PRs vs same-run main; plain 16.6 / hooked 22.0 ms at 5k hard, 10k warn-only)
        env:
          # Repo variable: path to a committed bench.json from main. Empty = budget only.
          # Passed as data so the value is not interpolated into the shell script.
          PERF_BASELINE: ${{ vars.PERF_BASELINE }}
        run: |
          # Annotations (::error::/::warning::) go to the log; the comparison table, the tier tables and the
          # verdict lines are appended to the job's step summary. PERF_BASELINE set = 5k regression vs that
          # stored file fails, 10k warns.
          #
          # SAME-RUN BASE (pull_request; motivation: #35 failed the 22 ms gate on slow hosts with no sim change):
          #   * relative check, always: head 5k p95 > base 5k p95 x 1.10 FAILS (plain and hooked; no ms slack).
          #   * mode=raw (default): head raw p95 <= the bar below.
          #   * mode=slow-runner, per tier and count, ONLY when main's own raw p95 in this job also misses that bar:
          #     head bar = bar x min(F, 1.5), F = base plain 5k p95 / 7.5 ms (check_perf.REFERENCE_PLAIN_FLOOR_P95_MS,
          #     main on a fast ubuntu-24.04 runner), clamped to >= 1.0. At most 24.9 ms plain, 33.0 ms hooked.
          #   * push to main: the base is the parent commit (the previous main tip) from this job, same rules
          #     (--base-kind push-parent only changes the wording and adds a "perf base: ..." log line).
          #   * no usable base (workflow_dispatch, a push whose parent is missing or cannot be benchmarked, a failed
          #     or NaN base run): mode=raw only, i.e. the raw bars; push logs it as FALLBACK with the reason.
          #   The mode of every tier is printed in the log ("perf mode: ...") and the step summary.
          #   10k uses the same logic, warning-only.
          #
          # ABSOLUTE BUDGETS: plain 5k p95 <= 16.6 ms (the real-device target) and hooked 5k p95 <= 22.0 ms
          # (--hooked-target-ms), both hard; 10k warn-only. 22.0 is wider than 16.6 for the per-bullet hook
          # cost; observed values, with run ids, are in scripting/README.md. The head's hooked/plain p95 ratio
          # is logged (stdout, step summary, reports/hooked-ratio.json), never gated.
          args=(
            python3 tools/ci/check_perf.py reports/bench.json
            --p95-ms 16.6 --floor-bullets 5000 --target-bullets 10000 --regression-pct 25
            --hooked-report reports/bench-hooked.json --hooked-target-ms 22.0
            --rel-tolerance-pct 10 --slow-runner-cap 1.5
            --ratio-json reports/hooked-ratio.json
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [ -n "${PERF_BASE_DIR:-}" ]; then
            # Passed even if the base run failed: check_perf.py then warns and uses the absolute budgets.
            args+=(--base-report reports/base-bench.json --base-hooked-report reports/base-bench-hooked.json)
          fi
          if [ "${PERF_BASE_KIND:-}" = push-parent ]; then
            args+=(--base-kind push-parent --base-sha "${PERF_BASE_SHA:-}")
            if [ -n "${PERF_NO_BASE_REASON:-}" ]; then
              args+=(--no-base-reason "$PERF_NO_BASE_REASON")
            fi
          fi
          if [ -n "${PERF_BASELINE:-}" ]; then
            args+=(--baseline "$PERF_BASELINE")
          fi
          "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-reports
          path: reports/
          if-no-files-found: ignore

  # ---- Native on_batch perf tier (after #63: native is the default backend where the library loads) ----------------
  # Same #42 rules as the "Bullet benchmark" job (CoS ruling), on its own bars, with the native library built:
  #   * on_batch tier: ./tools/run_benchmark.sh --backend=native --batch=1 --bullets=5000,10000 (one on_update_batch
  #     callback steers every bullet; native apply_batch). Gated by tools/ci/check_perf.py, not by the benchmark's own
  #     exit code. 5k HARD, 10k warning-only. Bars (check_perf.NATIVE_ON_BATCH_*; see the comment there):
  #       mode=raw (default): head raw p95 <= 6.0 ms at 5k, 10.0 ms at 10k.
  #       mode=slow-runner, ONLY when the same-run base's own raw p95 also misses that bar: bar x min(F, 1.5),
  #       F = base on_batch 5k p95 / 2.0 ms (check_perf.REFERENCE_NATIVE_ON_BATCH_FLOOR_P95_MS), clamped >= 1.0.
  #       relative, always: head p95 <= base p95 x 1.10, no absolute slack.
  #     The report must say backend "native" and batch 1 (a GDScript fallback fails, a GDScript base is unusable).
  #   * auto row: --backend=auto --bullets=5000,10000 (plain bullets). INFORMATIONAL: bars (16.6 ms) and the relative
  #     check are warnings only; it fails only if auto did not resolve to native with the library present.
  # The head library is this run's native-libs-linux.x86_64 artifact. The base (main on a PR, the parent commit on a
  # push) gets the same library when native/, scriptshot_native.gdextension and tools/build_native.sh are identical
  # in both trees; otherwise the base is built from its own sources here. No base = raw bars only (logged).
  # The plain 16.6 / hooked 22.0 ms GDScript rows stay in "Bullet benchmark (headless, p95 gate)", unchanged.
  perf-native:
    name: Bullet benchmark (native on_batch, p95 gate)
    runs-on: ubuntu-24.04
    needs: [native-linux]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-libs-linux.x86_64
          path: bin/linux.x86_64
      - name: Head native library
        run: |
          set -euo pipefail
          ls -la bin/linux.x86_64/
          test -s bin/linux.x86_64/libscriptshot_native.linux.template_debug.x86_64.so
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-godot
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-bin-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}
      - name: Download Godot (pinned, checksum-verified)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          zip="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          mkdir -p "$GODOT_DIR" && cd "$GODOT_DIR"
          curl -fsSL --retry 3 -O "$base/$zip" -O "$base/SHA512-SUMS.txt"
          grep -F " $zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" && rm "$zip"
          mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" godot
          chmod +x godot
      - name: Fetch native Lua libraries (linux.x86_64)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/ci/fetch_native_libs.sh linux.x86_64
      - name: Unit-test the perf gate (check_perf.py, merge_bench.py, cold_import.sh)
        working-directory: tools/ci
        run: python3 -m unittest test_check_perf test_merge_bench test_cold_import -v
      - name: Pick the same-run base (PR base main; push / dispatch with perf_parent_base = parent commit)
        if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.perf_parent_base)
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          # Same choice as the "Bullet benchmark" job: PR = first parent of the test-merge commit (else
          # pull_request.base.sha); push = github.event.before if it is a real commit, else HEAD^1. Failure = no
          # base: raw bars only, logged.
          fallback() {
            echo "::warning::perf base: none ($1); FALLBACK to the raw on_batch bars only"
            echo "PERF_NO_BASE_REASON=$1" >> "$GITHUB_ENV"
            exit 0
          }
          base=""
          if [ "$EVENT" = pull_request ]; then
            if git rev-parse --verify -q HEAD^2 >/dev/null; then
              base="$(git rev-parse HEAD^1)"
            else
              base="$BASE_SHA"
              git fetch --no-tags --depth=1 origin "$base" || fallback "pull_request.base.sha $base could not be fetched"
            fi
          else
            echo "PERF_BASE_KIND=push-parent" >> "$GITHUB_ENV"
            if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BEFORE_SHA" =~ ^0+$ ]] \
              && { git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; }; then
              base="$BEFORE_SHA"
            else
              base="$(git rev-parse --verify -q 'HEAD^1^{commit}' || true)"
              [ -n "$base" ] || fallback "HEAD has no parent commit"
            fi
          fi
          echo "baseline = $base"
          git worktree add --detach "$RUNNER_TEMP/perf-base" "$base" || fallback "git worktree add of $base failed"
          echo "PERF_BASE_DIR=$RUNNER_TEMP/perf-base" >> "$GITHUB_ENV"
          echo "PERF_BASE_SHA=$base" >> "$GITHUB_ENV"
          if git diff --quiet "$base" HEAD -- native scriptshot_native.gdextension tools/build_native.sh; then
            echo "native sources identical in base and head: the base reuses the head library"
            mkdir -p "$RUNNER_TEMP/perf-base/bin"
            cp -a bin/linux.x86_64 "$RUNNER_TEMP/perf-base/bin/"
          else
            echo "native sources differ: building the base library from $base"
            echo "PERF_BUILD_BASE=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.PERF_BUILD_BASE == '1'
        with:
          python-version: "3.x"
      - name: Restore SCons objects (base build)
        if: env.PERF_BUILD_BASE == '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scons-cache
          key: scons-native-${{ runner.os }}-linux-x86_64-debug+release-threads-${{ env.GODOT_CPP_COMMIT }}-scons${{ env.SCONS_VERSION }}-perf-base
          restore-keys: |
            scons-native-${{ runner.os }}-linux-x86_64-debug+release-threads-${{ env.GODOT_CPP_COMMIT }}-scons${{ env.SCONS_VERSION }}-
      - name: Build the base native library (only when native sources differ)
        if: env.PERF_BUILD_BASE == '1'
        run: |
          set -uo pipefail
          export SCONS_CACHE="$RUNNER_TEMP/scons-cache"
          python -m pip install "scons==${SCONS_VERSION}"
          cd "$PERF_BASE_DIR"
          if git submodule update --init --depth 1 native/godot-cpp && ./tools/build_native.sh linux debug; then
            ls -la bin/linux.x86_64/
          else
            # The base benchmark then fails to load native: check_perf.py drops it (raw bars, logged).
            echo "::warning::base native library build failed; the on_batch tier falls back to the raw bars"
          fi
      - name: Head tree at a path as long as the base's
        run: |
          set -euo pipefail
          # PR #64 A/A runs (head and base = the same sources and library) showed a per-tree offset that more rounds
          # did not remove (run 43207146923: base 5k p95 2.39-2.45 ms in all 4 rounds, head 2.08-2.23). One suspect is
          # the process layout (project path / environment length), so the head is benchmarked from a worktree at
          # $RUNNER_TEMP/perf-head, the same length as $RUNNER_TEMP/perf-base, instead of the job's checkout.
          git worktree add --detach "$RUNNER_TEMP/perf-head" HEAD
          mkdir -p "$RUNNER_TEMP/perf-head/bin"
          cp -a bin/linux.x86_64 "$RUNNER_TEMP/perf-head/bin/"
          echo "PERF_HEAD_DIR=$RUNNER_TEMP/perf-head" >> "$GITHUB_ENV"
      # A hung cold import would otherwise sit until the 40-minute job timeout.
      # 2 minutes is just over 4x the slowest successful cold-import step in
      # recent CI (19s), with room for one signal retry of head and base.
      - name: Cold import (head and base; ONE retry, only if Godot died on a signal)
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # tools/ci/cold_import.sh: 128 < exit < 160 (signal, e.g. 134 SIGABRT) on the first attempt -> ::warning::
          # with the crash excerpt, the full log kept in reports/import-logs/ (perf-native-reports artifact), one more
          # attempt. Any other non-zero exit (including rc=255) is a real import error and fails at once. This is the
          # ONLY retry in this job: the benchmarks, the unit tests and check_perf.py run once. Background: PR #64
          # run 43199386255 (head cold import: "double free or corruption (!prev)", exit 134); issue #69.
          mkdir -p reports/import-logs
          bash "$PERF_HEAD_DIR/tools/ci/fetch_native_libs.sh" linux.x86_64
          tools/ci/cold_import.sh "$PERF_HEAD_DIR" head reports/import-logs || exit 1
          if [ -n "${PERF_BASE_DIR:-}" ]; then
            if ! bash "$PERF_BASE_DIR/tools/ci/fetch_native_libs.sh" linux.x86_64 \
              || ! tools/ci/cold_import.sh "$PERF_BASE_DIR" base reports/import-logs; then
              echo "::warning::base cold import failed; perf_ab.sh drops the base when its run fails (raw bars only)"
            fi
          fi
      - name: Run benchmarks (native on_batch + auto; base and head alternating on this runner)
        run: |
          mkdir -p reports
          # ABBA rounds like the plain/hooked job, but 8 (median per count), 600 measured frames (the default). PR #64
          # A/A runs (base and head = the same sources and library): the 5k p95 varies 2.5-15% between processes
          # (rounds) on the runner whatever the frame count (600 / 2400 frames gave the same spread), so the noise is
          # per process, not per sample; more rounds shrink the error of the median that the strict +10% check uses.
          # The benchmark's own exit code is ignored: check_perf.py is the gate.
          set -o pipefail
          tiers="--tiers=onbatch,auto"
          args=(--out=reports --rounds=1 "$tiers" --onbatch-target-ms=6.0 --native-frames=600)
          if [ -n "${PERF_BASE_DIR:-}" ]; then
            args=(--out=reports --rounds=8 --base="$PERF_BASE_DIR" "$tiers" --onbatch-target-ms=6.0 --native-frames=600)
          fi
          "$PERF_HEAD_DIR/tools/ci/perf_ab.sh" "${args[@]}" 2>&1 | tee reports/bench-native.log
      - name: Enforce the native on_batch budget (6.0 ms at 5k hard, 10.0 ms at 10k warn; vs same-run base)
        run: |
          args=(
            python3 tools/ci/check_perf.py reports/bench-onbatch.json
            --tier-name "native on_batch" --title "Native on_batch bullet benchmark (--backend=native --batch=1)"
            --p95-ms 6.0 --p95-target-ms 10.0 --floor-bullets 5000 --target-bullets 10000
            --rel-tolerance-pct 10 --slow-runner-cap 1.5 --reference-ms 2.0
            --expect-backend native --expect-batch 1
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [ -n "${PERF_BASE_DIR:-}" ]; then
            args+=(--base-report reports/base-bench-onbatch.json)
          fi
          if [ "${PERF_BASE_KIND:-}" = push-parent ]; then
            args+=(--base-kind push-parent --base-sha "${PERF_BASE_SHA:-}")
            if [ -n "${PERF_NO_BASE_REASON:-}" ]; then
              args+=(--no-base-reason "$PERF_NO_BASE_REASON")
            fi
          fi
          "${args[@]}"
      - name: Auto backend row (informational; must resolve to native)
        if: always() && hashFiles('reports/bench-auto.json') != ''
        run: |
          args=(
            python3 tools/ci/check_perf.py reports/bench-auto.json
            --tier-name auto --title "Auto backend bullet benchmark (--backend=auto, plain bullets; informational)"
            --p95-ms 16.6 --floor-bullets 5000 --target-bullets 10000
            --rel-tolerance-pct 10 --slow-runner-cap 1.5 --reference-ms 2.0
            --expect-backend native --expect-batch 0 --informational
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [ -n "${PERF_BASE_DIR:-}" ]; then
            args+=(--base-report reports/base-bench-auto.json)
          fi
          if [ "${PERF_BASE_KIND:-}" = push-parent ]; then
            args+=(--base-kind push-parent --base-sha "${PERF_BASE_SHA:-}")
            if [ -n "${PERF_NO_BASE_REASON:-}" ]; then
              args+=(--no-base-reason "$PERF_NO_BASE_REASON")
            fi
          fi
          "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-native-reports
          path: reports/
          if-no-files-found: ignore


  web-smoke:
    # Static name: meant to become a required check once it has landed (QA sets that).
    name: Web smoke (headless Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLAYWRIGHT_VERSION: "1.64.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-godot
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-bin-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}
      - name: Download Godot (pinned, checksum-verified)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          zip="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          mkdir -p "$GODOT_DIR" && cd "$GODOT_DIR"
          curl -fsSL --retry 3 -O "$base/$zip" -O "$base/SHA512-SUMS.txt"
          grep -F " $zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" && rm "$zip"
          mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" godot
          chmod +x godot
      - name: Cache web export templates
        id: cache-web-templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_CHANNEL }}
          # Only version.txt and the two dlink no-threads zips (about 24 MB), not the 1.2 GB tpz.
          key: godot-templates-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}-web-dlink-nothreads
      - name: Download web export templates
        if: steps.cache-web-templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          tpz="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz"
          curl -fsSL --retry 3 -O "$base/$tpz" -O "$base/SHA512-SUMS.txt"
          grep -F " $tpz" SHA512-SUMS.txt | sha512sum -c -
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          mkdir -p "$dest"
          unzip -q "$tpz" -d tpl "templates/version.txt" "templates/web_dlink_nothreads_*.zip"
          mv tpl/templates/* "$dest/"
          rm -rf tpl "$tpz" SHA512-SUMS.txt
          for f in version.txt web_dlink_nothreads_debug.zip web_dlink_nothreads_release.zip; do
            test -s "$dest/$f" || { echo "::error::export template missing after extract: $f"; exit 1; }
          done
          ls -lh "$dest"
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium
      - name: Install Playwright + Chromium
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv-web"
          "$RUNNER_TEMP/venv-web/bin/pip" install --quiet "playwright==${PLAYWRIGHT_VERSION}"
          # System libraries are not cached; the browser download is skipped on a cache hit.
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            "$RUNNER_TEMP/venv-web/bin/python" -m playwright install-deps chromium
          else
            "$RUNNER_TEMP/venv-web/bin/python" -m playwright install --with-deps chromium
          fi
      - name: Web export + browser smoke (release, debug)
        env:
          PYTHON: ${{ runner.temp }}/venv-web/bin/python
          WEB_SMOKE_MODES: release debug
          # fetch_native_libs.sh uses it for the GitHub release API (rate limit).
          GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/ci/web_smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-smoke
          path: build/web-smoke/
          if-no-files-found: ignore

  # Decides the Export matrix. A separate job is required because a job-level `if` cannot see
  # matrix values (the condition is evaluated before the matrix expands). PRs never run this,
  # so they never pay for an export. A #67 GUT flake fails `test` and skips exports; rerun the
  # failed Import + GUT job (or the whole workflow) rather than shipping a red commit.
  export-matrix:
    name: Export matrix
    if: ${{ !cancelled() && needs.test.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.run_export)) }}
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.run_export }}
        run: |
          set -euo pipefail
          # One line so the script is not indented by the YAML block (a heredoc would SyntaxError).
          # slug is the artifact prefix (scriptshot-<slug>-<sha7>). out matches export_presets.cfg.
          # iOS is not a release target.
          python3 -c 'import json,os; core=[{"preset":"Linux","platform":"linux.x86_64","mode":"release","out":"build/linux/Scriptshot.x86_64","slug":"linux"},{"preset":"Windows Desktop","platform":"windows.x86_64","mode":"release","out":"build/windows/Scriptshot.exe","slug":"windows"},{"preset":"Web","platform":"web.wasm32","mode":"release","out":"build/web/index.html","slug":"web"}]; extra=[{"preset":"macOS","platform":"macos.universal","mode":"release","out":"build/macos/Scriptshot.zip","slug":"macos"},{"preset":"Android","platform":"android.arm64","mode":"debug","out":"build/android/Scriptshot-debug.apk","slug":"android"}]; cells=core+extra if os.environ.get("FULL")=="true" else core; print("matrix="+json.dumps({"include":cells},separators=(",",":")))' >> "$GITHUB_OUTPUT"

  export:
    # Static name. GitHub does not evaluate ${{ }} in a skipped job's name, so a conditional
    # shows up as the raw expression in the checks list. The preset is on the Export and Verify steps.
    name: Export
    # Preset names must match export_presets.cfg exactly (commit it; PR #2 un-ignored it,
    # export_credentials.cfg stays ignored). Everything is exported from Linux with the headless editor:
    # Windows/macOS/Linux/Web are release builds, unsigned (macOS is ad-hoc signed only), Android is a
    # DEBUG apk signed with a throwaway debug keystore generated below. Release signing for Android needs a
    # keystore secret (GODOT_ANDROID_KEYSTORE_RELEASE_*), which is Karyu's call and is not wired up.
    # Push to main: Linux, Windows, Web only (export-matrix). workflow_dispatch with run_export: the full
    # matrix, including macOS and Android. Pull requests do not run this job.
    # Native bullet core (#38): scriptshot_native.gdextension lists a library for every desktop platform, and an export
    # without bin/<platform>/ fails (dispatch 42696143148: Windows and Linux). Each cell restores the libraries from the
    # native jobs of this run: linux.x86_64 always (the Linux editor host loads it during import/export), plus its own
    # platform's. Linux and Windows cells need their library uploaded; the macOS cell needs GUT (macos, native) green.
    # macOS ships native, unsigned. Android stays without it (deferred, #39); Web excludes it by preset (#36).
    # Tests must have passed (needs.test / export-matrix). A mid-suite GUT hang (#67) is handled by rerunning, not by
    # shipping builds from a red commit.
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.export-matrix.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.run_export)) }}
    needs: [test, export-matrix, native-linux, gut-windows, gut-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.export-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-godot
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-bin-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}
      - name: Download Godot (pinned, checksum-verified)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          zip="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          mkdir -p "$GODOT_DIR" && cd "$GODOT_DIR"
          curl -fsSL --retry 3 -O "$base/$zip" -O "$base/SHA512-SUMS.txt"
          grep -F " $zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" && rm "$zip"
          mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" godot
          chmod +x godot
      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_CHANNEL }}
          # "slim" drops the previous full-tpz cache (about 2 GB). Godot finds templates by this
          # versioned directory, so a restore of only the files below is enough for the five presets.
          # "-dlink": the Web preset needs web_dlink_nothreads_*.zip (#40); an older "-slim" cache has
          # only web_nothreads_*.zip and must not be restored.
          key: godot-templates-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}-slim-dlink
      - name: Download export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          tpz="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz"
          curl -fsSL --retry 3 -O "$base/$tpz" -O "$base/SHA512-SUMS.txt"
          grep -F " $tpz" SHA512-SUMS.txt | sha512sum -c -
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          mkdir -p "$dest"
          # The release is one tpz (still downloaded whole). Cache only what the matrix needs.
          # Archive names (Godot 4.7.2): android_*.apk, macos.zip, windows_*_x86_64.exe,
          # linux_*.x86_64 (dot, not underscore), web_dlink_nothreads_*.zip, plus version.txt.
          # windows_*_x86_64_console.exe is not required: export_console_wrapper=1 is "Debug Only"
          # and this matrix exports Windows as release.
          # Web uses the dlink no-threads template (variant/extensions_support=true, issue #40), so the
          # plain web_nothreads_*.zip is not needed.
          unzip -q "$tpz" -d tpl \
            "templates/version.txt" \
            "templates/android_*.apk" \
            "templates/macos.zip" \
            "templates/windows_*_x86_64.exe" \
            "templates/linux_*.x86_64" \
            "templates/web_dlink_nothreads_*.zip"
          mv tpl/templates/* "$dest/"
          rm -rf tpl "$tpz" SHA512-SUMS.txt
          missing=0
          for f in \
            version.txt \
            android_debug.apk android_release.apk \
            macos.zip \
            windows_debug_x86_64.exe windows_release_x86_64.exe \
            linux_debug.x86_64 linux_release.x86_64 \
            web_dlink_nothreads_debug.zip web_dlink_nothreads_release.zip
          do
            if [ ! -s "$dest/$f" ]; then
              echo "::error::export template missing after extract: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          ls -lh "$dest"

      # ---- Android only: JDK, SDK packages, throwaway debug keystore, editor settings ----
      - name: Set up JDK ${{ env.JAVA_VERSION }} (Android)
        if: matrix.preset == 'Android'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Android SDK packages (Android)
        if: matrix.preset == 'Android'
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || { echo "::error::sdkmanager not found under $sdk (runner image changed?)"; exit 1; }
          "$sdkmanager" --licenses >/dev/null < <(yes)
          "$sdkmanager" "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;android-${ANDROID_COMPILE_SDK}"
          echo "ANDROID_SDK_DIR=$sdk" >> "$GITHUB_ENV"
      - name: Generate debug keystore and editor settings (Android)
        if: matrix.preset == 'Android'
        run: |
          set -euo pipefail
          # Throwaway key, regenerated every run. The well-known debug credentials are not secrets.
          # APKs from different runs therefore cannot be installed over each other (uninstall first).
          ks="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -keystore "$ks" -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Scriptshot CI Debug,O=Scriptshot,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$ks"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          # The headless editor reads the SDK/JDK locations from its editor settings file.
          major_minor="${GODOT_VERSION%.*}"
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_DIR\""
          } > "$HOME/.config/godot/editor_settings-${major_minor}.tres"

      - name: Check export preset policy
        run: |
          set -euo pipefail
          test -f export_presets.cfg || { echo "::error::export_presets.cfg missing (commit it; see PR #2 .gitignore note)"; exit 1; }
          python3 tools/ci/check_export_preset.py export_presets.cfg "${{ matrix.preset }}"
      # The 0.8.2 zip ships every platform library the export presets need (Windows,
      # macOS, Linux, Web wasm32, Android). Web threads vs nothreads is selected by
      # the gdextension file, not by a second download.
      - name: Fetch native Lua libraries (${{ matrix.platform }})
        if: ${{ hashFiles('tools/ci/fetch_native_libs.sh') != '' }}
        run: bash tools/ci/fetch_native_libs.sh "${{ matrix.platform }}"
      - name: Native bullet libraries built and tested in this run
        env:
          LINUX_BUILT: ${{ needs.native-linux.outputs.built }}
          WINDOWS_BUILT: ${{ needs.gut-windows.outputs.built }}
          GUT_MACOS: ${{ needs.gut-macos.result }}
          PRESET: ${{ matrix.preset }}
        run: |
          set -euo pipefail
          # Linux and Windows need their library built and uploaded (exports fail without it). macOS ships native
          # only once GUT (macos, native) is green (CoS ruling, #38).
          test "$LINUX_BUILT" = true || { echo "::error::Native libs (linux) did not upload native-libs-linux.x86_64"; exit 1; }
          case "$PRESET" in
            "Windows Desktop")
              test "$WINDOWS_BUILT" = true \
                || { echo "::error::GUT (windows, native) did not upload native-libs-windows.x86_64"; exit 1; } ;;
            macOS)
              test "$GUT_MACOS" = success \
                || { echo "::error::GUT (macos, native) is '$GUT_MACOS'; macOS ships native only once it is green"; exit 1; } ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-libs-linux.x86_64
          path: bin/linux.x86_64/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.preset == 'Windows Desktop'
        with:
          name: native-libs-windows.x86_64
          path: bin/windows.x86_64/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.preset == 'macOS'
        with:
          name: native-libs-macos.universal
          path: bin/macos.universal/
      - name: List native libraries
        run: ls -la bin/*/
      - name: Export (${{ matrix.preset }})
        run: |
          set -euo pipefail
          mkdir -p "$(dirname '${{ matrix.out }}')"
          # Same import policy as tools/run_benchmark.sh. A non-zero editor exit or a script/resource
          # error fails here. Do not swallow it with `|| true` (Godot can also exit 0 on some of them).
          ERROR_PATTERN='SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate'
          import_log="$(mktemp)"
          if ! "$GODOT" --headless --path . --import >"$import_log" 2>&1 || grep -a -q -E "$ERROR_PATTERN" "$import_log"; then
            cat "$import_log"
            echo "::error::project import failed before export"
            exit 1
          fi
          rm -f "$import_log"
          "$GODOT" --headless --path . --export-${{ matrix.mode }} "${{ matrix.preset }}" "${{ matrix.out }}"
          ls -la "$(dirname '${{ matrix.out }}')"
      - name: Verify export (${{ matrix.preset }})
        run: |
          set -euo pipefail
          out="${{ matrix.out }}"
          test -s "$out" || { echo "::error::export output missing or empty: $out"; exit 1; }
          case "${{ matrix.preset }}" in
            macOS)
              # Ad-hoc codesign failure is only an export warning, so Godot can still exit 0.
              # Write the listing to a file: grep -q under pipefail can SIGPIPE unzip and fail a good zip.
              list="$RUNNER_TEMP/macos-zip.txt"
              unzip -l "$out" > "$list"
              grep -q '_CodeSignature/CodeResources' "$list" \
                || { echo "::error::macOS zip has no _CodeSignature/CodeResources (ad-hoc sign did not run)"; exit 1; }
              grep -q 'libscriptshot_native.macos.template_release.universal.dylib' "$list" \
                || { echo "::error::macOS zip does not contain the native bullet dylib (#38: macOS ships native)"; exit 1; }
              grep 'libscriptshot_native' "$list"
              ;;
            Android)
              apksigner="${ANDROID_SDK_DIR}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
              test -x "$apksigner" || { echo "::error::apksigner not found at $apksigner"; exit 1; }
              "$apksigner" verify "$out"
              ;;
            Web)
              # dlink template used, Lua side module in, native bullet wasm and src/qa/ out.
              python3 tools/ci/web_smoke.py check-export "$(dirname "$out")"
              ;;
            Linux)
              # The native bullet .so is copied next to the binary (#38).
              test -s build/linux/libscriptshot_native.linux.template_release.x86_64.so \
                || { echo "::error::Linux export has no native bullet .so next to the binary (#38)"; exit 1; }
              # Official templates target an older glibc, so ubuntu-24.04 can run them.
              # Bound the run so a hang fails this step instead of the job timeout.
              chmod +x "$out"
              timeout 60s "$out" --headless --quit
              ;;
            "Windows Desktop")
              test -s build/windows/libscriptshot_native.windows.template_release.x86_64.dll \
                || { echo "::error::Windows export has no native bullet DLL next to the exe (#38)"; exit 1; }
              ;;
          esac
      - name: Artifact identity
        id: art
        run: |
          set -euo pipefail
          echo "sha7=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname -- '${{ matrix.out }}')" >> "$GITHUB_OUTPUT"
      # Ready-to-run folder only (Linux/Windows: binary + native and Lua libs; Web: the site tree).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scriptshot-${{ matrix.slug }}-${{ steps.art.outputs.sha7 }}
          path: ${{ steps.art.outputs.dir }}
          if-no-files-found: error
          retention-days: 90

  # ---- Native bullet core (issue #38; docs/native.md) -------------------------------------------------------------
  # Four jobs with stable names, on every PR and push to main and on workflow_dispatch. Not required checks (yet).
  #   Native libs (linux)      ubuntu-24.04: builds bin/linux.x86_64 (debug + release), then runs GUT with it loaded.
  #   Native libs (web)        ubuntu-24.04: builds bin/web.wasm32 (threads=no, Emscripten 4.0.20) as an artifact
  #                            only. NOT shipped: the Web presets keep "scriptshot_native.gdextension, bin/*" in their
  #                            exclude_filter (#36, #43) and web runs the GDScript pool.
  #   GUT (windows, native)    windows-latest, MSVC: builds bin/windows.x86_64, runs GUT under Git Bash with it loaded.
  #   GUT (macos, native)      macos-latest: builds the universal (arm64 + x86_64) dylib, runs GUT under macOS's
  #                            /bin/bash 3.2 with it loaded. macOS ships native (unsigned) from this artifact: the
  #                            manual export job packs it into the macOS cell only when this job passed.
  # Each GUT job fails unless tools/ci/gut_counts.py --expect-native sees 0 pending (the native GUT tests are pending
  # when NativeBulletSim is not registered; Linux reference: 10 host + 1088 unit, 0 pending).
  # Caches: SCons CacheDir ($SCONS_CACHE, honoured by native/godot-cpp/SConstruct) for the godot-cpp and native
  # objects, keyed by the godot-cpp commit, SCons version, platform, targets and threads; emsdk via setup-emsdk's
  # actions-cache-folder. bin/ is never cached (the libraries themselves are NoCache).
  # TODO(#39, deferred): Android arm64 (JDK 17, sdkmanager "ndk;29.0.14206865", NDK at
  # $ANDROID_HOME/ndk/29.0.14206865 because godot-cpp ignores ANDROID_NDK_ROOT when ANDROID_HOME is set; then
  # ./tools/build_native.sh android). Device or arm64-emulator run needed before it ships; not built here.
  native-linux:
    name: Native libs (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      # "true" once native-libs-linux.x86_64 is uploaded (the export job needs the library, not the GUT verdict).
      built: ${{ steps.libs.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Check the godot-cpp pin
        run: |
          got="$(git -C native/godot-cpp rev-parse HEAD)"
          test "$got" = "$GODOT_CPP_COMMIT" || { echo "::error::native/godot-cpp is $got, expected GODOT_CPP_COMMIT=$GODOT_CPP_COMMIT"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Install SCons ${{ env.SCONS_VERSION }}
        run: python -m pip install "scons==${SCONS_VERSION}"
      - name: SCons cache directory (outside the Godot project)
        shell: bash
        run: echo "SCONS_CACHE=${{ runner.temp }}/scons-cache" >>"$GITHUB_ENV"
      - name: Restore SCons objects
        id: scons-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scons-cache
          key: scons-native-${{ runner.os }}-linux-x86_64-debug+release-threads-${{ env.GODOT_CPP_COMMIT }}-scons${{ env.SCONS_VERSION }}-${{ hashFiles('native/SConstruct', 'native/src/**', 'tools/build_native.sh') }}
          restore-keys: |
            scons-native-${{ runner.os }}-linux-x86_64-debug+release-threads-${{ env.GODOT_CPP_COMMIT }}-scons${{ env.SCONS_VERSION }}-
      - name: Build (linux.x86_64, debug + release)
        id: build
        run: |
          set -euo pipefail
          start=$SECONDS
          ./tools/build_native.sh linux
          ls -la bin/linux.x86_64/
          echo "native build: $((SECONDS - start)) s" | tee -a "$GITHUB_STEP_SUMMARY"
      # Saved even when a later step (GUT) fails, so the next run does not rebuild godot-cpp from scratch.
      - name: Save SCons objects
        if: always() && steps.build.outcome == 'success' && steps.scons-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scons-cache
          key: ${{ steps.scons-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-libs-linux.x86_64
          path: bin/linux.x86_64/
          if-no-files-found: error
      - name: Library uploaded
        id: libs
        shell: bash
        run: echo "built=true" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-godot
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-bin-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}
      - name: Download Godot (pinned, checksum-verified)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          zip="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          mkdir -p "$GODOT_DIR" && cd "$GODOT_DIR"
          curl -fsSL --retry 3 -O "$base/$zip" -O "$base/SHA512-SUMS.txt"
          grep -F " $zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" && rm "$zip"
          mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" godot
          chmod +x godot
      # Same mid-suite stall as Import + GUT (#67). 6 minutes is just over 4x
      # the slowest successful Linux native GUT step in recent CI (77s).
      - name: Run GUT tests with the native library (headless)
        timeout-minutes: 6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          ./tools/run_tests.sh -gjunit_xml_file="res://reports/gut-junit.xml" 2>&1 | tee reports/gut.log
          exit "${PIPESTATUS[0]}"
      - name: Native backend ran (0 pending)
        if: always()
        run: python3 tools/ci/gut_counts.py reports/gut.log --expect-native --label linux --json reports/gut-counts.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gut-reports-linux-native
          path: reports/
          if-no-files-found: ignore

  native-web:
    name: Native libs (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Check the godot-cpp pin
        run: |
          got="$(git -C native/godot-cpp rev-parse HEAD)"
          test "$got" = "$GODOT_CPP_COMMIT" || { echo "::error::native/godot-cpp is $got, expected GODOT_CPP_COMMIT=$GODOT_CPP_COMMIT"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Install SCons ${{ env.SCONS_VERSION }}
        run: python -m pip install "scons==${SCONS_VERSION}"
      - name: Set up Emscripten ${{ env.EMSCRIPTEN_VERSION }}
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          # Cached with actions/cache under the workspace (key: workflow, version, OS, arch).
          actions-cache-folder: .emsdk-cache
      - name: Check the Emscripten pin
        run: |
          emcc --version | head -1
          emcc --version | head -1 | grep -qF " ${EMSCRIPTEN_VERSION} " \
            || { echo "::error::emcc is not ${EMSCRIPTEN_VERSION} (the official Godot ${GODOT_VERSION} web template build)"; exit 1; }
      - name: SCons cache directory (outside the Godot project)
        shell: bash
        run: echo "SCONS_CACHE=${{ runner.temp }}/scons-cache" >>"$GITHUB_ENV"
      - name: Restore SCons objects
        id: scons-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scons-cache
          key: scons-native-${{ runner.os }}-web-wasm32-debug+release-nothreads-em${{ env.EMSCRIPTEN_VERSION }}-${{ env.GODOT_CPP_COMMIT }}-scons${{ env.SCONS_VERSION }}-${{ hashFiles('native/SConstruct', 'native/src/**', 'tools/build_native.sh') }}
          restore-keys: |
            scons-native-${{ runner.os }}-web-wasm32-debug+release-nothreads-em${{ env.EMSCRIPTEN_VERSION }}-${{ env.GODOT_CPP_COMMIT }}-scons${{ env.SCONS_VERSION }}-
      - name: Build (web.wasm32, threads=no, debug + release)
        id: build
        run: |
          set -euo pipefail
          start=$SECONDS
          ./tools/build_native.sh web
          ls -la bin/web.wasm32/
          for t in debug release; do
            f="bin/web.wasm32/libscriptshot_native.web.template_${t}.wasm32.nothreads.wasm"
            test -s "$f" || { echo "::error::missing $f (the name scriptshot_native.gdextension lists)"; exit 1; }
          done
          echo "native build: $((SECONDS - start)) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The shipping Web presets still exclude the native library
        run: |
          set -euo pipefail
          # Built for #36 only. Shipping it on web means removing these entries (docs/native.md "Web export").
          python3 - <<'PY'
          import configparser, sys
          cp = configparser.ConfigParser(interpolation=None, strict=False)
          cp.read("export_presets.cfg")
          bad = []
          for sec in cp.sections():
              if sec.count(".") != 1 or cp.get(sec, "platform", fallback="").strip('"') != "Web":
                  continue
              flt = [x.strip() for x in cp.get(sec, "exclude_filter", fallback="").strip('"').split(",")]
              name = cp.get(sec, "name").strip('"')
              print(f"{name}: exclude_filter {flt}")
              if "scriptshot_native.gdextension" not in flt or "bin/*" not in flt:
                  bad.append(name)
          if bad:
              print(f"::error::Web preset(s) {bad} no longer exclude scriptshot_native.gdextension and bin/* (#36)")
              sys.exit(1)
          PY
      # Saved even when a later step (GUT) fails, so the next run does not rebuild godot-cpp from scratch.
      - name: Save SCons objects
        if: always() && steps.build.outcome == 'success' && steps.scons-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scons-cache
          key: ${{ steps.scons-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Artifact only, not shipped (see the job comment above).
          name: native-libs-web.wasm32
          path: bin/web.wasm32/
          if-no-files-found: error

  gut-windows:
    name: GUT (windows, native)
    runs-on: windows-latest
    timeout-minutes: 50
    outputs:
      built: ${{ steps.libs.outputs.built }}
    defaults:
      run:
        # Git Bash, the same shell run_tests.sh is written for.
        shell: bash
    env:
      GODOT: ${{ github.workspace }}/.godot-bin/Godot_v4.7.2-stable_win64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Check the godot-cpp pin
        run: |
          got="$(git -C native/godot-cpp rev-parse HEAD)"
          test "$got" = "$GODOT_CPP_COMMIT" || { echo "::error::native/godot-cpp is $got, expected GODOT_CPP_COMMIT=$GODOT_CPP_COMMIT"; exit 1; }
          case "$GODOT" in *"Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_win64.exe") ;; *) echo "::error::GODOT ($GODOT) does not match GODOT_VERSION"; exit 1 ;; esac
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: python3 on PATH (the scripts call python3; Windows Python is python.exe)
        run: |
          set -euo pipefail
          shim="$RUNNER_TEMP/python3-shim"
          mkdir -p "$shim"
          printf '#!/bin/sh\nexec python "$@"\n' >"$shim/python3"
          chmod +x "$shim/python3"
          cygpath -w "$shim" >>"$GITHUB_PATH"
      - name: Install SCons ${{ env.SCONS_VERSION }}
        run: |
          python -m pip install "scons==${SCONS_VERSION}"
          python3 --version
          bash --version | head -1
      - name: SCons cache directory (outside the Godot project)
        shell: bash
        run: echo "SCONS_CACHE=${{ runner.temp }}/scons-cache" >>"$GITHUB_ENV"
      - name: Restore SCons objects
        id: scons-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scons-cache
          key: scons-native-${{ runner.os }}-windows-x86_64-msvc-debug+release-threads-${{ env.GODOT_CPP_COMMIT }}-scons${{ env.SCONS_VERSION }}-${{ hashFiles('native/SConstruct', 'native/src/**', 'tools/build_native.sh') }}
          restore-keys: |
            scons-native-${{ runner.os }}-windows-x86_64-msvc-debug+release-threads-${{ env.GODOT_CPP_COMMIT }}-scons${{ env.SCONS_VERSION }}-
      - name: Build (windows.x86_64, MSVC, debug + release)
        id: build
        run: |
          set -euo pipefail
          start=$SECONDS
          # On a Windows host build_native.sh leaves the compiler to godot-cpp: MSVC (no use_mingw).
          ./tools/build_native.sh windows
          ls -la bin/windows.x86_64/
          echo "native build: $((SECONDS - start)) s" | tee -a "$GITHUB_STEP_SUMMARY"
      # Saved even when a later step (GUT) fails, so the next run does not rebuild godot-cpp from scratch.
      - name: Save SCons objects
        if: always() && steps.build.outcome == 'success' && steps.scons-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scons-cache
          key: ${{ steps.scons-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-libs-windows.x86_64
          # The .dll files only (MSVC also writes .lib/.exp/.pdb next to them).
          path: bin/windows.x86_64/*.dll
          if-no-files-found: error
      - name: Library uploaded
        id: libs
        shell: bash
        run: echo "built=true" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-godot
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-bin-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}
      - name: Download Godot (pinned, checksum-verified)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          zip="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_win64.exe.zip"
          mkdir -p "$GODOT_DIR" && cd "$GODOT_DIR"
          curl -fsSL --retry 3 -O "$base/$zip" -O "$base/SHA512-SUMS.txt"
          grep -F " $zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" && rm "$zip" SHA512-SUMS.txt
          ls -la
      - name: Godot version
        run: |
          "$GODOT" --headless --version
      - name: run_tests.sh guard cases (fake godot, Git Bash)
        run: |
          RUN_TESTS_BASH="$(cygpath -w "$(command -v bash)")" python -m unittest tools/ci/test_run_tests_guard.py -v
      # Same mid-suite stall (#67) can sit until the 50-minute job timeout.
      # 8 minutes is just over 4x the slowest successful Windows GUT step in
      # recent CI (105s), with a minute of runner-variance headroom.
      - name: Run GUT tests with the native library (headless, Git Bash)
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          ./tools/run_tests.sh -gjunit_xml_file="res://reports/gut-junit.xml" 2>&1 | tee reports/gut.log
          exit "${PIPESTATUS[0]}"
      - name: Native backend ran (0 pending)
        if: always()
        run: python tools/ci/gut_counts.py reports/gut.log --expect-native --label windows --json reports/gut-counts.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gut-reports-windows-native
          path: reports/
          if-no-files-found: ignore

  gut-macos:
    name: GUT (macos, native)
    runs-on: macos-latest
    timeout-minutes: 50
    env:
      GODOT: ${{ github.workspace }}/.godot-bin/Godot.app/Contents/MacOS/Godot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Check the godot-cpp pin
        run: |
          got="$(git -C native/godot-cpp rev-parse HEAD)"
          test "$got" = "$GODOT_CPP_COMMIT" || { echo "::error::native/godot-cpp is $got, expected GODOT_CPP_COMMIT=$GODOT_CPP_COMMIT"; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Install SCons ${{ env.SCONS_VERSION }}
        run: python -m pip install "scons==${SCONS_VERSION}"
      - name: bash 3.2 first on PATH (macOS /bin/bash; the runner image also has a Homebrew bash 5)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/bash32"
          mkdir -p "$d"
          ln -sf /bin/bash "$d/bash"
          echo "$d" >>"$GITHUB_PATH"
          /bin/bash --version | head -1
          /bin/bash -c 'case "$BASH_VERSION" in 3.2.*) ;; *) echo "::error::/bin/bash is $BASH_VERSION, not 3.2"; exit 1 ;; esac'
      - name: SCons cache directory (outside the Godot project)
        shell: bash
        run: echo "SCONS_CACHE=${{ runner.temp }}/scons-cache" >>"$GITHUB_ENV"
      - name: Restore SCons objects
        id: scons-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scons-cache
          key: scons-native-${{ runner.os }}-macos-universal-debug+release-threads-${{ env.GODOT_CPP_COMMIT }}-scons${{ env.SCONS_VERSION }}-${{ hashFiles('native/SConstruct', 'native/src/**', 'tools/build_native.sh') }}
          restore-keys: |
            scons-native-${{ runner.os }}-macos-universal-debug+release-threads-${{ env.GODOT_CPP_COMMIT }}-scons${{ env.SCONS_VERSION }}-
      - name: Build (macos.universal, debug + release)
        id: build
        shell: /bin/bash -eo pipefail {0}
        run: |
          bash --version | head -1
          start=$SECONDS
          /bin/bash ./tools/build_native.sh macos
          ls -la bin/macos.universal/
          for t in debug release; do
            f="bin/macos.universal/libscriptshot_native.macos.template_${t}.universal.dylib"
            archs="$(lipo -archs "$f")"
            echo "$f: $archs"
            case " $archs " in *" arm64 "*) ;; *) echo "::error::$f has no arm64 slice"; exit 1 ;; esac
            case " $archs " in *" x86_64 "*) ;; *) echo "::error::$f has no x86_64 slice"; exit 1 ;; esac
            vtool -show-build "$f" | grep -E 'architecture|minos' || true
          done
          echo "native build: $((SECONDS - start)) s" | tee -a "$GITHUB_STEP_SUMMARY"
      # Saved even when a later step (GUT) fails, so the next run does not rebuild godot-cpp from scratch.
      - name: Save SCons objects
        if: always() && steps.build.outcome == 'success' && steps.scons-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scons-cache
          key: ${{ steps.scons-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Shipped: the manual export job packs this into the macOS export (unsigned).
          name: native-libs-macos.universal
          path: bin/macos.universal/*.dylib
          if-no-files-found: error
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-godot
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-bin-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}
      - name: Download Godot (pinned, checksum-verified)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          zip="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_macos.universal.zip"
          mkdir -p "$GODOT_DIR" && cd "$GODOT_DIR"
          curl -fsSL --retry 3 -O "$base/$zip" -O "$base/SHA512-SUMS.txt"
          grep -F " $zip" SHA512-SUMS.txt | shasum -a 512 -c -
          unzip -q "$zip" && rm "$zip" SHA512-SUMS.txt
          ls -la
      - name: Godot version
        run: |
          "$GODOT" --headless --version
      - name: run_tests.sh guard cases (fake godot, /bin/bash 3.2)
        run: RUN_TESTS_BASH=/bin/bash python3 -m unittest tools/ci/test_run_tests_guard.py -v
      # Same mid-suite stall (#67). 7 minutes is just over 4x the slowest
      # successful macOS GUT step in recent CI (94s).
      - name: Run GUT tests with the native library (headless, /bin/bash 3.2)
        timeout-minutes: 7
        shell: /bin/bash -o pipefail {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          /bin/bash ./tools/run_tests.sh -gjunit_xml_file="res://reports/gut-junit.xml" 2>&1 | tee reports/gut.log
          exit "${PIPESTATUS[0]}"
      - name: Native backend ran (0 pending)
        if: always()
        run: python3 tools/ci/gut_counts.py reports/gut.log --expect-native --label macos --json reports/gut-counts.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gut-reports-macos-native
          path: reports/
          if-no-files-found: ignore
