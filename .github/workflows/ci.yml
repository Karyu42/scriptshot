# Scriptshot CI.
#   test   : headless import + GUT suite (./tools/run_tests.sh) and the export-preset policy check
#            (tools/ci/check_export_preset.py, all five presets) on every PR and push to main.
#   perf   : headless bullet benchmark (./tools/run_benchmark.sh) on every PR. p95 <= 16.6 ms is a HARD gate at
#            5,000 bullets (floor) and a warning-only target at 10,000 (tools/ci/check_perf.py).
#   export : manual (workflow_dispatch) Windows/macOS/Linux/Web/Android export (unsigned/debug). docs/qa/release-builds.md.
#   native-libs : DISABLED stub for per-platform native Lua libraries (bin/<platform>/); enable only if the binding is a GDExtension.
# Checkout does not enable Git LFS or submodules: this repo has neither. If native-libs starts
# building godot-cpp from a submodule, turn submodules back on for that job only.
# Headless numbers use the dummy renderer: they measure CPU simulation cost, not GPU/rendering.
# See docs/qa/stress-test-plan.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_export:
        description: "Run the export matrix (needs a committed export_presets.cfg)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Single source of truth for the engine version. Keep in sync with
  # config/features in project.godot ("4.7") and the vendored GUT (addons/gut, 9.7.x = Godot 4.7.x).
  GODOT_VERSION: "4.7.2"
  GODOT_CHANNEL: stable
  GODOT_DIR: ${{ github.workspace }}/.godot-bin
  # tools/run_tests.sh and tools/run_benchmark.sh honour $GODOT.
  GODOT: ${{ github.workspace }}/.godot-bin/godot
  PYTHONDONTWRITEBYTECODE: "1"
  # Toolchain pins, taken from the Godot 4.7.2-stable tag (godotengine/godot): Android from
  # platform/android/java/app/config.gradle (compileSdk 36, buildTools 36.1.0, ndkVersion 29.0.14206865,
  # Java 17), Python/SCons from .github/actions/godot-deps (SCons 4.10.1), Emscripten from
  # .github/workflows/web_builds.yml (EM_VERSION 4.0.11). Update them together with GODOT_VERSION.
  # NDK stays 29.0.14206865. r28b (28.1.13356709) is not the pin: docs/scripting/spike-results.md
  # section 12 and docs/qa/release-builds.md chose Godot's own NDK for the shared pipeline.
  # EMSCRIPTEN_VERSION is that engine CI pin. docs/scripting/testing.md uses 4.0.20 when building
  # Scriptshot's own extension against the official web template; leave 4.0.11 until native-libs
  # is actually enabled and that pin is reconciled on purpose.
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.1.0"
  ANDROID_NDK_VERSION: "29.0.14206865"
  # godot-cpp 10.0.0-stable (2026-09-15), api_version 4.7. The disabled native-libs job must use
  # this commit if it is turned on. Not lua-gdextension 0.8.2's 58d1de7 (10.0.0-rc1, 4.6 API).
  GODOT_CPP_COMMIT: "507ed9d840c01a3c5b2a39af8bb4000bfac30bf5"
  SCONS_VERSION: "4.10.1"
  EMSCRIPTEN_VERSION: "4.0.11"

jobs:
  test:
    name: Import + GUT tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check export preset policy
        run: |
          set -euo pipefail
          test -f export_presets.cfg || { echo "::error::export_presets.cfg is not committed"; exit 1; }
          # Same checker the manual export job runs. Pure Python, so a bad codesign / ABI /
          # keystore flag fails the PR instead of waiting for a workflow_dispatch export.
          for preset in "Windows Desktop" "macOS" "Linux" "Web" "Android"; do
            python3 tools/ci/check_export_preset.py export_presets.cfg "$preset"
          done

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-bin-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}

      - name: Download Godot (pinned, checksum-verified)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          zip="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          mkdir -p "$GODOT_DIR" && cd "$GODOT_DIR"
          curl -fsSL --retry 3 -O "$base/$zip" -O "$base/SHA512-SUMS.txt"
          grep -F " $zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" && rm "$zip"
          mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" godot
          chmod +x godot

      - name: Godot version
        run: |
          "$GODOT" --headless --version
          # Fail early if the engine and the project's declared version drift apart.
          want="${GODOT_VERSION%.*}"
          grep -q "config/features=.*\"$want\"" project.godot \
            || { echo "::error::project.godot config/features does not list \"$want\" (GODOT_VERSION=$GODOT_VERSION)"; exit 1; }

      # Stock lua-gdextension 0.8.2 (Lua 5.4). The script checks the zip SHA256 and
      # pre-seeds .godot/extension_list.cfg (issue #7). run_tests.sh fetches again;
      # that second call is a no-op when the pin file is already present.
      - name: Fetch native Lua libraries (linux.x86_64)
        if: ${{ hashFiles('tools/ci/fetch_native_libs.sh') != '' }}
        run: bash tools/ci/fetch_native_libs.sh linux.x86_64

      - name: Run GUT tests (headless)
        run: |
          mkdir -p reports
          # run_tests.sh = `godot --headless --import` + `-s res://addons/gut/gut_cmdln.gd -gexit`.
          # It exits non-zero on a test failure, a non-zero import exit, or any line matching its
          # ERROR_PATTERN (SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|
          # Failed to instantiate) in the import or test output. Config: .gutconfig.json (tests/unit).
          # Extra args pass straight to GUT. ERROR_PATTERN includes
          # "Failed to load GDExtension" so a missing or broken addon fails the job.
          ./tools/run_tests.sh -gjunit_xml_file="res://reports/gut-junit.xml" 2>&1 | tee reports/gut.log
          exit "${PIPESTATUS[0]}"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### GUT"
            sed 's/\x1b\[[0-9;]*m//g' reports/gut.log \
              | grep -E "^(Scripts|Tests|Passing Tests|Failing Tests|Risky/Pending|Asserts|Time) |All tests passed|tests? failed" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            reports/
          if-no-files-found: ignore

  perf:
    name: Bullet benchmark (headless, p95 gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-godot
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-bin-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}
      - name: Download Godot (pinned, checksum-verified)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          zip="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          mkdir -p "$GODOT_DIR" && cd "$GODOT_DIR"
          curl -fsSL --retry 3 -O "$base/$zip" -O "$base/SHA512-SUMS.txt"
          grep -F " $zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" && rm "$zip"
          mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" godot
          chmod +x godot
      - name: Fetch native Lua libraries (linux.x86_64)
        if: ${{ hashFiles('tools/ci/fetch_native_libs.sh') != '' }}
        run: bash tools/ci/fetch_native_libs.sh linux.x86_64
      - name: Unit-test the perf gate (tools/ci/check_perf.py)
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Run benchmark (5k floor + 10k target)
        run: |
          mkdir -p reports
          # run_benchmark.sh imports (and fails on script/resource errors), then runs the scene with the
          # same policy as check_perf.py: --floor-bullets is a hard fail (exit 1 on a p95 miss, or if the
          # count was not benchmarked/reached) and --target-bullets only prints a WARN (exit 0).
          # check_perf.py stays the CI gate (it also writes the step summary and the baseline check).
          # The JSON is written either way; a benchmark failure is tolerated only if it left JSON
          # behind and was not caused by an import/script error (those print "run_benchmark.sh: ...").
          # Follow-up (not this job): median-of-3, or one retry when only the floor fails.
          # docs/qa/stress-test-plan.md already plans that; headroom is still large, so it is not a gate.
          set +e
          ./tools/run_benchmark.sh --bullets=2000,5000,10000 --floor-bullets=5000 --target-bullets=10000 \
            --target-ms=16.6 \
            --json="$PWD/reports/bench.json" 2>&1 | tee reports/bench.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^run_benchmark.sh:' reports/bench.log; then
            echo "::error::benchmark run failed on import/script errors"; exit 1
          fi
          [ -s reports/bench.json ] || { echo "::error::benchmark produced no JSON (exit $rc)"; exit 1; }
      - name: Run hooked benchmark (every bullet runs a no-op on_update hook; 5k floor + 10k target)
        run: |
          mkdir -p reports
          # Same policy and error handling as the plain run above, with --hooked=1.0: all bullets carry a
          # script hook, so this measures the per-bullet hook cost (BulletPool.run_update_hooks + its
          # sanitize check). The plain tiers are untouched; check_perf.py judges both files below.
          set +e
          ./tools/run_benchmark.sh --bullets=5000,10000 --hooked=1.0 --floor-bullets=5000 --target-bullets=10000 \
            --target-ms=16.6 \
            --json="$PWD/reports/bench-hooked.json" 2>&1 | tee reports/bench-hooked.log
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^run_benchmark.sh:' reports/bench-hooked.log; then
            echo "::error::hooked benchmark run failed on import/script errors"; exit 1
          fi
          [ -s reports/bench-hooked.json ] || { echo "::error::hooked benchmark produced no JSON (exit $rc)"; exit 1; }
      - name: Enforce budget (plain 5k hard fail, 10k warn-only; hooked 5k hard fail at 22 ms, 10k warn-only)
        env:
          # Repo variable: path to a committed bench.json from main. Empty = budget only.
          # Passed as data so the value is not interpolated into the shell script.
          PERF_BASELINE: ${{ vars.PERF_BASELINE }}
        run: |
          # Annotations (::error::/::warning::) go to the log; the full table and verdict lines are
          # appended to the job's step summary. PERF_BASELINE set = 5k regression fails, 10k regression warns.
          #
          # HOOKED BUDGET (--hooked-target-ms 22.0) is calibrated to GitHub-hosted runners: observed hooked 5k
          # p95 was 10.3-18.5 ms across runner instances (the same job differs ~1.8x between machines), so the
          # real-device 16.6 ms would fail on hardware luck alone. 22 ms passes every observed runner and still
          # catches the hook cost doubling (~0.65 -> ~1.3 us/bullet/tick, about +3.3 ms at 5k). 16.6 ms stays the
          # real-device target (the plain tiers keep it). Revisit with a dedicated runner.
          # The hooked/plain p95 ratio of this same run is logged (stdout, step summary, reports/hooked-ratio.json),
          # never gated.
          args=(
            python3 tools/ci/check_perf.py reports/bench.json
            --p95-ms 16.6 --floor-bullets 5000 --target-bullets 10000 --regression-pct 25
            --hooked-report reports/bench-hooked.json --hooked-target-ms 22.0
            --ratio-json reports/hooked-ratio.json
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [ -n "${PERF_BASELINE:-}" ]; then
            args+=(--baseline "$PERF_BASELINE")
          fi
          "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-reports
          path: reports/
          if-no-files-found: ignore

  export:
    # Static name. GitHub does not evaluate ${{ }} in a skipped job's name, so a conditional
    # shows up as the raw expression in the checks list. The preset is on the Export and Verify steps.
    name: Export
    # Manual only. Preset names must match export_presets.cfg exactly (commit it; PR #2 un-ignored it,
    # export_credentials.cfg stays ignored). Everything is exported from Linux with the headless editor:
    # Windows/macOS/Linux/Web are release builds, unsigned (macOS is ad-hoc signed only), Android is a
    # DEBUG apk signed with a throwaway debug keystore generated below. Release signing for Android needs a
    # keystore secret (GODOT_ANDROID_KEYSTORE_RELEASE_*), which is Karyu's call and is not wired up.
    if: github.event_name == 'workflow_dispatch' && inputs.run_export
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: "Windows Desktop", platform: "windows.x86_64", mode: release, out: "build/windows/Scriptshot.exe" }
          - { preset: "macOS",           platform: "macos.universal", mode: release, out: "build/macos/Scriptshot.zip" }
          - { preset: "Linux",           platform: "linux.x86_64",   mode: release, out: "build/linux/Scriptshot.x86_64" }
          - { preset: "Web",             platform: "web.wasm32",     mode: release, out: "build/web/index.html" }
          - { preset: "Android",         platform: "android.arm64",  mode: debug,   out: "build/android/Scriptshot-debug.apk" }
          # Output paths equal the export_path of each preset in export_presets.cfg.
          # iOS is NOT a release target. If an iOS compile check is ever wanted it must run on a macOS
          # runner and is low priority; leave this commented out:
          # - { preset: "iOS", platform: "ios.universal", mode: debug, out: "build/ios/Scriptshot.xcodeproj" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-godot
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-bin-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}
      - name: Download Godot (pinned, checksum-verified)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          zip="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          mkdir -p "$GODOT_DIR" && cd "$GODOT_DIR"
          curl -fsSL --retry 3 -O "$base/$zip" -O "$base/SHA512-SUMS.txt"
          grep -F " $zip" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" && rm "$zip"
          mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" godot
          chmod +x godot
      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_CHANNEL }}
          # "slim" drops the previous full-tpz cache (about 2 GB). Godot finds templates by this
          # versioned directory, so a restore of only the files below is enough for the five presets.
          key: godot-templates-${{ env.GODOT_VERSION }}-${{ env.GODOT_CHANNEL }}-slim
      - name: Download export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          tpz="Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz"
          curl -fsSL --retry 3 -O "$base/$tpz" -O "$base/SHA512-SUMS.txt"
          grep -F " $tpz" SHA512-SUMS.txt | sha512sum -c -
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          mkdir -p "$dest"
          # The release is one tpz (still downloaded whole). Cache only what the matrix needs.
          # Archive names (Godot 4.7.2): android_*.apk, macos.zip, windows_*_x86_64.exe,
          # linux_*.x86_64 (dot, not underscore), web_nothreads_*.zip, plus version.txt.
          # windows_*_x86_64_console.exe is not required: export_console_wrapper=1 is "Debug Only"
          # and this matrix exports Windows as release.
          # Add web_dlink_nothreads_*.zip when variant/extensions_support is turned on
          # (GDExtension / Lua). Do not add it before then.
          unzip -q "$tpz" -d tpl \
            "templates/version.txt" \
            "templates/android_*.apk" \
            "templates/macos.zip" \
            "templates/windows_*_x86_64.exe" \
            "templates/linux_*.x86_64" \
            "templates/web_nothreads_*.zip"
          mv tpl/templates/* "$dest/"
          rm -rf tpl "$tpz" SHA512-SUMS.txt
          missing=0
          for f in \
            version.txt \
            android_debug.apk android_release.apk \
            macos.zip \
            windows_debug_x86_64.exe windows_release_x86_64.exe \
            linux_debug.x86_64 linux_release.x86_64 \
            web_nothreads_debug.zip web_nothreads_release.zip
          do
            if [ ! -s "$dest/$f" ]; then
              echo "::error::export template missing after extract: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          ls -lh "$dest"

      # ---- Android only: JDK, SDK packages, throwaway debug keystore, editor settings ----
      - name: Set up JDK ${{ env.JAVA_VERSION }} (Android)
        if: matrix.preset == 'Android'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Android SDK packages (Android)
        if: matrix.preset == 'Android'
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || { echo "::error::sdkmanager not found under $sdk (runner image changed?)"; exit 1; }
          "$sdkmanager" --licenses >/dev/null < <(yes)
          "$sdkmanager" "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;android-${ANDROID_COMPILE_SDK}"
          echo "ANDROID_SDK_DIR=$sdk" >> "$GITHUB_ENV"
      - name: Generate debug keystore and editor settings (Android)
        if: matrix.preset == 'Android'
        run: |
          set -euo pipefail
          # Throwaway key, regenerated every run. The well-known debug credentials are not secrets.
          # APKs from different runs therefore cannot be installed over each other (uninstall first).
          ks="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -keystore "$ks" -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Scriptshot CI Debug,O=Scriptshot,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$ks"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          # The headless editor reads the SDK/JDK locations from its editor settings file.
          major_minor="${GODOT_VERSION%.*}"
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_DIR\""
          } > "$HOME/.config/godot/editor_settings-${major_minor}.tres"

      - name: Check export preset policy
        run: |
          set -euo pipefail
          test -f export_presets.cfg || { echo "::error::export_presets.cfg missing (commit it; see PR #2 .gitignore note)"; exit 1; }
          python3 tools/ci/check_export_preset.py export_presets.cfg "${{ matrix.preset }}"
      # The 0.8.2 zip ships every platform library the export presets need (Windows,
      # macOS, Linux, Web wasm32, Android). Web threads vs nothreads is selected by
      # the gdextension file, not by a second download.
      - name: Fetch native Lua libraries (${{ matrix.platform }})
        if: ${{ hashFiles('tools/ci/fetch_native_libs.sh') != '' }}
        run: bash tools/ci/fetch_native_libs.sh "${{ matrix.platform }}"
      - name: Export (${{ matrix.preset }})
        run: |
          set -euo pipefail
          mkdir -p "$(dirname '${{ matrix.out }}')"
          # Same import policy as tools/run_benchmark.sh. A non-zero editor exit or a script/resource
          # error fails here. Do not swallow it with `|| true` (Godot can also exit 0 on some of them).
          ERROR_PATTERN='SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|Failed to instantiate'
          import_log="$(mktemp)"
          if ! "$GODOT" --headless --path . --import >"$import_log" 2>&1 || grep -a -q -E "$ERROR_PATTERN" "$import_log"; then
            cat "$import_log"
            echo "::error::project import failed before export"
            exit 1
          fi
          rm -f "$import_log"
          "$GODOT" --headless --path . --export-${{ matrix.mode }} "${{ matrix.preset }}" "${{ matrix.out }}"
          ls -la "$(dirname '${{ matrix.out }}')"
      - name: Verify export (${{ matrix.preset }})
        run: |
          set -euo pipefail
          out="${{ matrix.out }}"
          test -s "$out" || { echo "::error::export output missing or empty: $out"; exit 1; }
          case "${{ matrix.preset }}" in
            macOS)
              # Ad-hoc codesign failure is only an export warning, so Godot can still exit 0.
              # Write the listing to a file: grep -q under pipefail can SIGPIPE unzip and fail a good zip.
              list="$RUNNER_TEMP/macos-zip.txt"
              unzip -l "$out" > "$list"
              grep -q '_CodeSignature/CodeResources' "$list" \
                || { echo "::error::macOS zip has no _CodeSignature/CodeResources (ad-hoc sign did not run)"; exit 1; }
              ;;
            Android)
              apksigner="${ANDROID_SDK_DIR}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
              test -x "$apksigner" || { echo "::error::apksigner not found at $apksigner"; exit 1; }
              "$apksigner" verify "$out"
              ;;
            Linux)
              # Official templates target an older glibc, so ubuntu-24.04 can run them.
              # Bound the run so a hang fails this step instead of the job timeout.
              chmod +x "$out"
              timeout 60s "$out" --headless --quit
              ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scriptshot-${{ matrix.preset }}
          path: build/

  # DISABLED stub (runs only when vars.ENABLE_NATIVE_LIBS == 'true'). Native builds of GDExtension libraries on GitHub-hosted runners, one per
  # platform, each uploading bin/<platform>/. Enable (set the variable) only when the binding decision
  # needs it and tools/ci/build_native_libs.sh exists. Toolchain pins come from the env block:
  # NDK 29.0.14206865 (not r28b 28.1.13356709) and godot-cpp 507ed9d840c01a3c5b2a39af8bb4000bfac30bf5 (10.0.0-stable).
  # Note: upstream Godot 4.7.2 builds macOS on macos-26; this project decided macos-14 (Apple Silicon).
  native-libs:
    # Static name. A ${{ }} conditional in name: is shown verbatim when the job is skipped.
    # Platform is on the Build step.
    name: Native libs
    # Off until the repository variable ENABLE_NATIVE_LIBS is set to 'true'.
    if: ${{ vars.ENABLE_NATIVE_LIBS == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: "linux.x86_64",    runner: ubuntu-24.04,    target: linux }
          - { platform: "windows.x86_64",  runner: windows-latest,  target: windows }  # MSVC (preinstalled VS Build Tools)
          - { platform: "macos.universal", runner: macos-14,        target: macos }
          - { platform: "web.wasm32",      runner: ubuntu-24.04,    target: web }       # threads and nothreads variants
          - { platform: "android.arm64",   runner: ubuntu-24.04,    target: android }
          # - { platform: "ios.universal", runner: macos-14, target: ios }  # not a release target; optional compile check only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Install SCons ${{ env.SCONS_VERSION }}
        shell: bash
        run: python -m pip install "scons==${SCONS_VERSION}"
      - name: Set up Emscripten ${{ env.EMSCRIPTEN_VERSION }}
        if: matrix.target == 'web'
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          no-cache: true
      - name: Set up JDK ${{ env.JAVA_VERSION }} and NDK ${{ env.ANDROID_NDK_VERSION }}
        if: matrix.target == 'android'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Android NDK
        if: matrix.target == 'android'
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=$sdk/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Build (${{ matrix.platform }})
        shell: bash
        run: bash tools/ci/build_native_libs.sh "${{ matrix.platform }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-libs-${{ matrix.platform }}
          path: bin/${{ matrix.platform }}/
          if-no-files-found: error
